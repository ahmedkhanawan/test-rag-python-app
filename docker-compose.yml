# Application stack: Qdrant + FastAPI backend + React (nginx).
#   docker compose up --build -d     ->  http://localhost:8080
# Needs backend/.env (copy .env.example). Works with Colima; Docker Desktop is not required.
name: company-knowledge-assistant

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    # Same storage as scripts/start-qdrant.sh. Run only one of the two at a time.
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////data/app.db
      LOG_FORMAT: json
      EVALUATION_DIR: /evaluation
    volumes:
      - app-data:/data
      - ./evaluation:/evaluation:ro
    depends_on:
      qdrant:
        condition: service_healthy
    # No published port: only the frontend container can reach the API.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-data:
