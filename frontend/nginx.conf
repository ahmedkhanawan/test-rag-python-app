server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # PDF uploads; the backend enforces MAX_UPLOAD_MB (default 20) itself.
    client_max_body_size 25m;

    # Everything the built app loads is same-origin (no CDNs). Bootstrap and React use
    # inline style attributes, hence 'unsafe-inline' for styles only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof its address to dodge login throttling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;  # the backend sets its own
        proxy_read_timeout 120s;                   # embedding + generation can be slow
    }

    location /assets/ {
        expires 1y;  # hashed file names
    }

    location / {
        try_files $uri /index.html;  # single-page app routes
    }
}
